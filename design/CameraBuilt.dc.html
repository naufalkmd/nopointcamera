body{margin:0;background:#050806}
a{color:#B8F23A}a:hover{color:#D6FF6E}
.np-key{position:absolute;display:block;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.np-key img{display:block;transition:transform 0.08s ease, filter 0.08s ease}

.np-key:focus-visible{outline:2px solid #B8F23A;outline-offset:2px;border-radius:14px}

</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const LOOKS = ['expired', 'infrared', 'riso', 'double', 'bluehour', 'dreamy', 'noir', 'pastel'];
    const s = this.state || {};
    const shots = s.shots ?? 0;
    const lastFx = s.lastFx || 'expired';
    const review = s.review || null;
    const flashOn = s.flashOn ?? true;
    return {
      lastFx,
      even: shots % 2 === 0,
      odd: shots % 2 === 1,
      live: !review,
      reviewing: !!review,
      reviewFx: review || 'live',
      mirror: s.mirrored ? -1 : 1,
      bx: +(-(s.px ?? 0) * 12).toFixed(2),
      by: +(-(s.py ?? 0) * 12).toFixed(2),
      flashPressed: flashOn ? 'true' : 'false',
      ledOpacity: flashOn ? 1 : 0.12,
      flashOpacity: s.flashing ? 1 : 0,
      flashTransition: s.flashing ? 'none' : 'opacity 0.5s ease-out',
      tiltMove: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top) / r.height - 0.5;
        if (this.tiltFrame) return;
        this.tiltFrame = requestAnimationFrame(() => {
          this.tiltFrame = null;
          this.setState({ px: +px.toFixed(3), py: +py.toFixed(3) });
        });
      },
      tiltReset: () => this.setState({ px: 0, py: 0 }),
      shoot: () => {
        const rest = LOOKS.filter((x) => x !== lastFx);
        const fx = rest[Math.floor(Math.random() * rest.length)];
        this.setState({ shots: shots + 1, lastFx: fx, review: fx, flashing: flashOn });
        setTimeout(() => this.setState({ flashing: false }), 70);
        clearTimeout(this.reviewTimer);
        this.reviewTimer = setTimeout(() => this.setState({ review: null }), 1600);
      },
      flip: () => this.setState({ mirrored: !s.mirrored }),
      toggleFlash: () => this.setState({ flashOn: !flashOn })
    };
  }
}
</script>
