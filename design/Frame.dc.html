<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nopointcam print frame</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 344px; height: 469px; position: relative; color: #2E2819; font-family: 'Bagel Fat One', system-ui, sans-serif">
<div style="position: absolute; left: 22px; top: 22px; width: 300px; height: 425px; transform: rotate({{tilt}}deg); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4)) drop-shadow(0 12px 16px rgba(0, 0, 0, 0.38))">
<div style="position: relative; width: 300px; height: 425px; box-sizing: border-box; padding: 16px 16px 0; border-radius: 3px; background: #EEE8DA; overflow: hidden; box-shadow: inset 0 0 28px rgba(125, 98, 52, 0.3); -webkit-mask-image: radial-gradient(circle at 223px 385px, transparent 3.6px, #000 4.3px); mask-image: radial-gradient(circle at 223px 385px, transparent 3.6px, #000 4.3px)">
<img src="../assets/paper-texture.png" alt="" style="position: absolute; top: 0; left: 0; width: 300px; height: 425px; object-fit: cover; mix-blend-mode: soft-light; opacity: 0.9; pointer-events: none">
<div style="position: relative; width: 268px; height: 335px; border-radius: 2px; overflow: hidden; background: #1A1712">
<dc-import name="Photo" fx="{{fx}}" hint-size="268px,335px"></dc-import>
<div style="position: absolute; top: 0; left: 0; width: 268px; height: 335px; box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(0, 0, 0, 0.3); pointer-events: none"></div>
</div>
<span style="position: absolute; left: 0; top: 371px; width: 212px; text-align: right; font-size: 22px; line-height: 22px; color: #2E2819; opacity: 0.9; mix-blend-mode: multiply; white-space: nowrap">nopo<span aria-hidden="true" style="display: inline-block; width: 0.19em; height: 0.52em; border-radius: 0.09em; background: #2E2819; margin: 0 0.05em"></span>ntcam</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fx":{"editor":"enum","options":["expired","infrared","riso","double","bluehour","dreamy","noir","pastel"],"default":"expired"},"tilt":{"editor":"range","min":-6,"max":6,"step":1,"unit":"deg","default":0},"$preview":{"width":344,"height":469}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      fx: this.props.fx ?? 'expired',
      tilt: this.props.tilt ?? 0
    };
  }
}
</script>
</body>
</html>
