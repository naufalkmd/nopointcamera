<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nopointcam looks</title>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1F1C2B}
.np-wall{background-color:#1F1C2B;background-image:url(../assets/wall-texture.png);background-size:512px 512px}
</style>
</helmet>
<div class="np-wall" style="width: 1160px; height: 800px; box-sizing: border-box; padding: 48px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; justify-items: center; align-items: center; overflow: hidden">
<div style="zoom: 0.72"><dc-import name="Frame" fx="expired" tilt="0" hint-size="344px,469px"></dc-import></div>
<div style="zoom: 0.72"><dc-import name="Frame" fx="infrared" tilt="0" hint-size="344px,469px"></dc-import></div>
<div style="zoom: 0.72"><dc-import name="Frame" fx="riso" tilt="0" hint-size="344px,469px"></dc-import></div>
<div style="zoom: 0.72"><dc-import name="Frame" fx="double" tilt="0" hint-size="344px,469px"></dc-import></div>
<div style="zoom: 0.72"><dc-import name="Frame" fx="bluehour" tilt="0" hint-size="344px,469px"></dc-import></div>
<div style="zoom: 0.72"><dc-import name="Frame" fx="dreamy" tilt="0" hint-size="344px,469px"></dc-import></div>
<div style="zoom: 0.72"><dc-import name="Frame" fx="noir" tilt="0" hint-size="344px,469px"></dc-import></div>
<div style="zoom: 0.72"><dc-import name="Frame" fx="pastel" tilt="0" hint-size="344px,469px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1160,"height":800}}'>

  renderVals() {
    return {};
  }
}
</script>

</html>
